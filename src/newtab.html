<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>New Window</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0f0f0f; color: rgba(255, 255, 255, 0.55);
      font: 13px/1.6 -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center; padding: 0 24px; box-sizing: border-box;
    }
    kbd {
      font: inherit; padding: 1px 6px; border-radius: 4px;
      background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div>
    Press <kbd>⌘L</kbd> to open a URL or search.<br>
    Hover the top edge to drag this window.
  </div>
</body>
</html>
